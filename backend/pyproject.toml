[tool.poetry]
name = "health-plan-optimizer-backend"
version = "0.1.0"
description = "Multi-agent decision intelligence backend for personalised health plans."
authors = ["Health Plan Optimizer Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.5"
uvicorn = { extras = ["standard"], version = "0.32.1" }
pydantic = "2.10.3"
anthropic = "0.40.0"
sse-starlette = "2.1.3"
httpx = "0.28.1"
python-dotenv = "1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"
ruff = "0.8.3"
mypy = "1.13.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
